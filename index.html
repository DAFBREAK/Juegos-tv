<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Arcade Web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
      padding: 1.5rem;
      flex: 1;
    }
    .card {
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
    }
    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #020617;
    }
    .card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .badge {
      align-self: flex-start;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      background: #0284c7;
      color: #fff;
    }
    #player-view {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      flex-direction: column;
    }
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #334155;
    }
    .btn-exit {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    #game-container {
      width: 100%;
      flex: 1;
      position: relative;
    }
  </style>
</head>
<body>

  <header>
    <h1>🕹️ Retro Arcade Web</h1>
    <span style="font-size: 0.85rem; color: #94a3b8;">Compatible con PC, TV, Móvil y Joysticks</span>
  </header>

  <main class="catalog" id="catalog"></main>

  <div id="player-view">
    <div class="player-header">
      <span id="current-title" style="font-size: 1rem; font-weight: 600; color: #38bdf8;"></span>
      <button class="btn-exit" onclick="closeGame()">✕ Salir del juego</button>
    </div>
    <div id="game-container"></div>
  </div>

  <script>
    const gameList = [
      {
        title: "Street Fighter II (SoR2 Hack)",
        system: "sega",
        core: "segaMD",
        cover: "https://images.igdb.com/igdb/image/upload/t_cover_big/co20vo.jpg",
        romUrl: "https://archive.org/download/kratuss-so-r-2-hacks-with-the-street-fighter-characters/Kratuss%20SoR2%20Hacks%20with%20the%20Street%20Fighter%20characters.zip"
      }
    ];

    const catalogEl = document.getElementById("catalog");
    const playerView = document.getElementById("player-view");
    const gameContainer = document.getElementById("game-container");
    const currentTitle = document.getElementById("current-title");

    gameList.forEach(game => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${game.cover}" alt="${game.title}" loading="lazy" />
        <div class="card-body">
          <div class="card-title">${game.title}</div>
          <span class="badge">${game.system}</span>
        </div>
      `;
      card.onclick = () => launchGame(game);
      catalogEl.appendChild(card);
    });

    function launchGame(game) {
      playerView.style.display = "flex";
      currentTitle.innerText = `${game.title} (${game.system.toUpperCase()})`;
      gameContainer.innerHTML = '<div id="game" style="width:100%; height:100%;"></div>';

      window.EJS_player = "#game";
      window.EJS_core = game.core;
      window.EJS_gameUrl = game.romUrl;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

      const script = document.createElement("script");
      script.id = "ejs-script";
      script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      document.body.appendChild(script);
    }

    function closeGame() {
      playerView.style.display = "none";
      gameContainer.innerHTML = "";
      const script = document.getElementById("ejs-script");
      if (script) script.remove();
      window.EJS_gameUrl = null;
    }
  </script>
</body>
</html>
